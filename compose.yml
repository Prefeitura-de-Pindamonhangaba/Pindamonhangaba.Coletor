name: pinda-coletor-dev
services:
  collector:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      APP_ENV: development
      DATABASE_EXTERNAL: "false"
      DATABASE_URL: postgresql://coletor:coletor_dev@database:5432/coletor
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      INTEGRATION_KEYS_ENCRYPTION_KEY: ${INTEGRATION_KEYS_ENCRYPTION_KEY:-}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_ALLOW_INSECURE_HTTP: ${KEYCLOAK_ALLOW_INSECURE_HTTP:-false}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./scripts:/app/scripts:ro
      - ./docs:/app/docs:ro
      - ./drizzle:/app/drizzle:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "scripts/check-health.ts"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    networks:
      - collector
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: coletor
      POSTGRES_PASSWORD: coletor_dev
      POSTGRES_DB: coletor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coletor -d coletor"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - collector
volumes:
  postgres_data:
networks:
  collector:
