services:
  collector:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - collector
networks:
  collector:
